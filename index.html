
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Washer Logl</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>*{font-family:Inter,sans-serif}.mono{font-family:'JetBrains Mono',monospace}</style>
</head>
<body class="bg-[#fafaf8]">
<div id="root"></div>
<script type="module">
import React from 'https://esm.sh/react@18.3.1';
import ReactDOM from 'https://esm.sh/react-dom@18.3.1/client';
const {useState,useEffect,useMemo} = React;

const GS_URL = 'https://script.google.com/macros/s/AKfycbw12v-_GPBPwOaWVP43m_6DDFsrKkj35NpVWYSAKINlXy6nGGvMHVWIIp88eyt0kzVp/exec';

const at=()=>Math.random().toString(36).slice(2,9);
const ie=(e)=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(e);
const b=(e)=>e>=1000?`${(e/1000).toFixed(2)} L`:`${Math.round(e)} ml`;
const en=(e)=>e.toISOString().slice(0,10);
const Ft=(e,n)=>{let t=new Date(e); t.setDate(t.getDate()+n); return t;};
const genPass=(role)=>{
  const ch='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%';
  let len=role==='admin'?12:10; let pwd='';
  pwd+='ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(Math.random()*26)];
  pwd+='abcdefghijklmnopqrstuvwxyz'[Math.floor(Math.random()*26)];
  pwd+='23456789'[Math.floor(Math.random()*8)];
  pwd+='!@#$%'[Math.floor(Math.random()*5)];
  for(let i=4;i<len;i++) pwd+=ch[Math.floor(Math.random()*ch.length)];
  return pwd.split('').sort(()=>0.5-Math.random()).join('');
};
const checkPass=(pwd)=>{
  let s=0,m=[];
  if(pwd.length>=8) s++; else m.push('Min 8');
  if(/[A-Z]/.test(pwd)) s++; else m.push('Besar');
  if(/[a-z]/.test(pwd)) s++; else m.push('kecil');
  if(/[0-9]/.test(pwd)) s++; else m.push('angka');
  if(/[^A-Za-z0-9]/.test(pwd)) s++; else m.push('simbol');
  return {score:s,level:s<=2?'Lemah':s===3?'Sedang':s===4?'Kuat':'Sangat Kuat',msg:m};
};

const defaultStaff=[
  {id:'st1',name:'Budi Santoso',role:'operator',username:'budi',password:'Budi2024!@#'},
  {id:'st2',name:'Siti Aminah',role:'supervisor',username:'siti',password:'Siti$up2024!'},
  {id:'st3',name:'Rina Admin',role:'admin',username:'rina',password:'R1na@Admin2024!'},
];

function useLocal(k,d){
  const [v,setV]=useState(()=>{
    try{let s=localStorage.getItem('lc_final_'+k); return s?JSON.parse(s):d;}catch{return d;}
  });
  useEffect(()=>{try{localStorage.setItem('lc_final_'+k,JSON.stringify(v));}catch{}},[k,v]);
  return [v,setV];
}

function App(){
  const [staff,setStaff]=useLocal('staff',defaultStaff);
  const [logs,setLogs]=useLocal('logs',[]);
  const [currentUser,setCurrentUser]=useLocal('user',null);
  const [page,setPage]=useState('dashboard');

  // Login
  const [u,setU]=useState('');
  const [p,setP]=useState('');
  const [show,setShow]=useState(false);
  const [err,setErr]=useState('');
  const [attempts,setAttempts]=useState(0);

  // Add user form
  const [nName,setNName]=useState('');
  const [nRole,setNRole]=useState('operator');
  const [nUser,setNUser]=useState('');
  const [nPass,setNPass]=useState('');
  const [editId,setEditId]=useState(null);

  // Dummy logs
  useEffect(()=>{
    if(logs.length) return;
    let arr=[]; let now=new Date();
    for(let i=0;i<20;i++){
      let d=Ft(now,-Math.floor(Math.random()*20));
      d.setHours(8+Math.floor(Math.random()*10),0,0,0);
      arr.push({
        id:at(),
        timestamp:d.toISOString(),
        machine_code:'MESIN-0'+(Math.floor(Math.random()*3)+1),
        load_weight_kg:50,
        total_ml:350,
        total_cost:15000,
        staff_name:staff[0].name
      });
    }
    setLogs(arr);
  },[]);

  const handleLogin=()=>{
    let found=staff.find((s)=>s.username===u.toLowerCase());
    if(!found){setErr('Username tidak ada'); return;}
    if(found.password!==p){
      let a=attempts+1; setAttempts(a);
      if(a>=5){setErr('Salah 5x, tunggu 1 menit'); setTimeout(()=>{setAttempts(0); setErr('');},60000); return;}
      setErr(`Password salah (${a}/5)`); return;
    }
    setCurrentUser(found); setErr(''); setP(''); setAttempts(0);
  };

  const filtered=logs;
  const totalKg=filtered.reduce((a,c)=>a+(c.load_weight_kg||0),0);
  const totalMl=filtered.reduce((a,c)=>a+(c.total_ml||0),0);
  const totalCost=filtered.reduce((a,c)=>a+(c.total_cost||0),0);

  if(!currentUser){
    return (
      <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-zinc-900 to-zinc-700">
        <div className="w-full max-w-[400px] bg-white rounded-[24px] p-7 shadow-2xl">
          <div className="text-center mb-7">
            <div className="w-12 h-12 bg-zinc-900 text-white rounded-xl grid place-items-center font-bold mx-auto">LC</div>
            <div className="font-bold text-lg mt-3">LaundryChem V2</div>
            <div className="text-[11px] uppercase tracking-widest text-zinc-500 font-semibold">Login Staff</div>
          </div>

          <div className="space-y-4">
            <div>
              <div className="text-[11px] uppercase font-semibold text-zinc-600 mb-1">Username</div>
              <input
                className="w-full border border-zinc-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-zinc-900 focus:ring-2 focus:ring-zinc-900/10"
                placeholder="ketik username, contoh: budi"
                value={u}
                onChange={(e)=>setU(e.target.value.toLowerCase())}
              />
            </div>
            <div>
              <div className="text-[11px] uppercase font-semibold text-zinc-600 mb-1">Password</div>
              <div className="relative">
                <input
                  type={show?'text':'password'}
                  className="w-full border border-zinc-200 rounded-xl px-4 py-3 text-sm mono outline-none focus:border-zinc-900 focus:ring-2 focus:ring-zinc-900/10 pr-12"
                  placeholder="ketik password"
                  value={p}
                  onChange={(e)=>setP(e.target.value)}
                  onKeyDown={(e)=>{if(e.key==='Enter') handleLogin();}}
                />
                <button onClick={()=>setShow(!show)} className="absolute right-3 top-1/2 -translate-y-1/2 text-[11px] text-zinc-500 border px-2 py-1 rounded-full bg-zinc-50">
                  {show?'Hide':'Show'}
                </button>
              </div>
            </div>

            {err && <div className="bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl px-3 py-2">{err}</div>}

            <button onClick={handleLogin} className="w-full bg-zinc-900 text-white rounded-xl py-3.5 text-sm font-semibold hover:bg-black">
              Masuk
            </button>

            <div className="bg-zinc-50 border rounded-xl p-3 mt-4">
              <div className="text-[11px] font-bold uppercase tracking-widest">Akun Demo (bisa hapus nanti)</div>
              <div className="text-[11px] mono text-zinc-600 mt-1 leading-relaxed">
                admin → rina / R1na@Admin2024!<br/>
                supervisor → siti / Siti$up2024!<br/>
                operator → budi / Budi2024!@#
              </div>
            </div>
          </div>
        </div>
      </div>
    );
  }

  const isAdmin=currentUser.role==='admin';

  return (
    <div className="max-w-[1280px] mx-auto flex flex-col md:flex-row min-h-screen">
      <aside className="md:w-[260px] p-4">
        <div className="bg-white rounded-[20px] border p-4 sticky top-4">
          <div className="font-bold">LaundryChem</div>
          <div className="text-xs text-zinc-500">{currentUser.name} • {currentUser.role}</div>
          <div className="mono text-[11px] text-zinc-500 mb-4">@{currentUser.username}</div>

          <div className="space-y-1">
            <button onClick={()=>setPage('dashboard')} className={`w-full text-left px-3 py-2.5 rounded-xl text-sm ${page==='dashboard'?'bg-zinc-900 text-white':'hover:bg-zinc-100'}`}>Dashboard</button>
            {isAdmin && <button onClick={()=>setPage('users')} className={`w-full text-left px-3 py-2.5 rounded-xl text-sm ${page==='users'?'bg-zinc-900 text-white':'hover:bg-zinc-100'}`}>Setting • Tambah User</button>}
            <button onClick={()=>setPage('riwayat')} className={`w-full text-left px-3 py-2.5 rounded-xl text-sm ${page==='riwayat'?'bg-zinc-900 text-white':'hover:bg-zinc-100'}`}>Riwayat</button>
          </div>

          <button onClick={()=>setCurrentUser(null)} className="mt-6 w-full border rounded-xl py-2 text-xs">Logout</button>

          <div className="mt-4 text-[11px] text-zinc-500 bg-zinc-50 border rounded-xl p-3">
            <div className="font-semibold">Google Sheet</div>
            <div className="mono text-[10px] mt-1 break-all">{GS_URL.slice(0,60)}...</div>
            <div className="text-[10px] mt-1">Sudah terhubung otomatis</div>
          </div>
        </div>
      </aside>

      <main className="flex-1 p-4">
        {page==='dashboard' && (
          <div className="space-y-4">
            <div className="bg-white rounded-[20px] border p-5">
              <div className="font-bold">Halo, {currentUser.name}</div>
              <div className="text-sm text-zinc-500">Kamu login sebagai {currentUser.role} • Username: {currentUser.username}</div>
              <div className="grid grid-cols-3 gap-3 mt-4">
                <div className="bg-zinc-900 text-white rounded-xl p-4"><div className="text-[11px] uppercase opacity-60">Cuci</div><div className="text-2xl font-bold">{filtered.length}</div></div>
                <div className="bg-blue-600 text-white rounded-xl p-4"><div className="text-[11px] uppercase opacity-80">Kg</div><div className="text-2xl font-bold">{totalKg}</div></div>
                <div className="bg-emerald-600 text-white rounded-xl p-4"><div className="text-[11px] uppercase opacity-80">Biaya</div><div className="mono font-bold">{ie(totalCost)}</div></div>
              </div>
            </div>
          </div>
        )}

        {page==='users' && (
          <div className="bg-white rounded-[20px] border p-6">
            <div className="font-bold text-lg">Setting • Tambah User Baru</div>
            <div className="text-sm text-zinc-500">Hanya admin bisa nambah, edit, reset password. Login pakai username ketik biasa.</div>

            <div className="mt-6 bg-zinc-50 border rounded-[16px] p-4 grid md:grid-cols-2 gap-4">
              <div>
                <div className="text-[11px] uppercase font-semibold text-zinc-500">Nama Lengkap</div>
                <input className="w-full border rounded-xl px-3 py-2.5 text-sm mt-1" value={nName} onChange={(e)=>setNName(e.target.value)} placeholder="Budi Santoso"/>
              </div>
              <div>
                <div className="text-[11px] uppercase font-semibold text-zinc-500">Role</div>
                <select className="w-full border rounded-xl px-3 py-2.5 text-sm mt-1" value={nRole} onChange={(e)=>setNRole(e.target.value)}>
                  <option value="operator">operator (hanya input cuci)</option>
                  <option value="supervisor">supervisor (lihat laporan)</option>
                  <option value="admin">admin (full akses + tambah user)</option>
                </select>
              </div>
              <div>
                <div className="text-[11px] uppercase font-semibold text-zinc-500">Username (ketik biasa, tanpa spasi)</div>
                <input className="w-full border rounded-xl px-3 py-2.5 text-sm mt-1 mono" value={nUser} onChange={(e)=>setNUser(e.target.value.toLowerCase().replace(/\s/g,''))} placeholder="contoh: budi02"/>
              </div>
              <div>
                <div className="text-[11px] uppercase font-semibold text-zinc-500 flex justify-between">
                  <span>Password Kuat</span>
                  <button onClick={()=>setNPass(genPass(nRole))} className="text-blue-600 hover:underline">Generate Otomatis</button>
                </div>
                <input className="w-full border rounded-xl px-3 py-2.5 text-sm mt-1 mono" value={nPass} onChange={(e)=>setNPass(e.target.value)} placeholder="min 8 karakter, besar kecil angka simbol"/>
                {nPass && (
                  <div className="mt-1">
                    {(()=>{
                      let c=checkPass(nPass);
                      return <span className={`text-[10px] px-2 py-0.5 rounded-full border font-semibold ${c.score>=4?'bg-emerald-50 border-emerald-200 text-emerald-700':c.score===3?'bg-amber-50 border-amber-200 text-amber-700':'bg-red-50 border-red-200 text-red-700'}`}>{c.level} ({c.score}/5) {c.msg.join(', ')}</span>
                    })()}
                  </div>
                )}
              </div>
              <div className="md:col-span-2 flex gap-2">
                <button
                  onClick={()=>{
                    if(!nName||!nUser||!nPass) return alert('Lengkapi!');
                    let ch=checkPass(nPass); if(ch.score<3) return alert('Password lemah: '+ch.msg.join(', '));
                    if(staff.find((s)=>s.username===nUser && s.id!==editId)) return alert('Username sudah ada');
                    if(editId){
                      setStaff(st=>st.map((s)=>s.id===editId?{...s,name:nName,role:nRole,username:nUser,password:nPass}:s));
                      setEditId(null);
                    }else{
                      setStaff(st=>[...st,{id:at(),name:nName,role:nRole,username:nUser,password:nPass}]);
                    }
                    setNName(''); setNUser(''); setNPass('');
                  }}
                  className="bg-zinc-900 text-white px-6 py-2.5 rounded-xl text-sm font-semibold"
                >
                  {editId?'Update User':'Tambah User'}
                </button>
                {editId && <button onClick={()=>{setEditId(null); setNName(''); setNUser(''); setNPass('');}} className="border px-5 py-2.5 rounded-xl text-sm">Batal</button>}
              </div>
            </div>

            <div className="mt-6 space-y-2">
              <div className="font-semibold text-sm">Daftar User Aktif ({staff.length})</div>
              {staff.map((s)=>{
                let cp=checkPass(s.password);
                return (
                  <div key={s.id} className="flex justify-between items-center border rounded-xl px-4 py-3 bg-zinc-50/50">
                    <div>
                      <div className="font-medium text-sm flex items-center gap-2">
                        {s.name}
                        <span className={`text-[10px] px-2 py-0.5 rounded-full border uppercase font-semibold ${s.role==='admin'?'bg-violet-50 border-violet-200 text-violet-700':s.role==='supervisor'?'bg-blue-50 border-blue-200 text-blue-700':'bg-amber-50 border-amber-200 text-amber-700'}`}>{s.role}</span>
                        <span className={`text-[10px] px-1.5 py-0.5 rounded-full border ${cp.score>=4?'bg-emerald-50 border-emerald-200 text-emerald-700':'bg-amber-50 border-amber-200 text-amber-700'}`}>{cp.level}</span>
                      </div>
                      <div className="mono text-xs text-zinc-600">@{s.username} • <span className="select-all">{s.password}</span></div>
                    </div>
                    <div className="flex gap-1.5">
                      <button onClick={()=>{setEditId(s.id); setNName(s.name); setNRole(s.role); setNUser(s.username); setNPass(s.password);}} className="text-[11px] bg-white border px-3 py-1.5 rounded-full">Edit</button>
                      <button onClick={()=>{let np=genPass(s.role); if(confirm(`Reset ${s.name} jadi ${np}?`)) setStaff(st=>st.map((x)=>x.id===s.id?{...x,password:np}:x));}} className="text-[11px] bg-white border px-3 py-1.5 rounded-full">Reset</button>
                      <button onClick={()=>{if(s.id===currentUser.id) return alert('Gak bisa hapus diri sendiri'); if(confirm(`Hapus ${s.name}?`)) setStaff(st=>st.filter((x)=>x.id!==s.id));}} className="text-[11px] bg-white border px-3 py-1.5 rounded-full text-red-600">Hapus</button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {page==='riwayat' && (
          <div className="bg-white rounded-[20px] border p-5">
            <div className="font-semibold">Riwayat (dummy)</div>
            <div className="text-sm text-zinc-500">{filtered.length} data</div>
          </div>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
